<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Domain Lookup — Home</title>

    <meta
        name="description"
        content="Find publicly available domain registration information."
    >

    <link rel="stylesheet" href="css/style.css">

    <style>
        .home-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .home-container {
            width: min(760px, 100%);

            text-align: center;

            animation: homeIn 0.7s ease both;
        }

        .home-icon {
            width: 76px;
            height: 76px;

            margin: 0 auto 28px;

            display: grid;
            place-items: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(124, 140, 255, 0.3),
                    rgba(124, 140, 255, 0.07)
                );

            border: 1px solid rgba(124, 140, 255, 0.25);

            color: #aeb7ff;

            font-size: 38px;

            box-shadow:
                0 20px 60px rgba(80, 95, 255, 0.12);
        }

        .home-eyebrow {
            display: inline-block;

            margin-bottom: 20px;

            color: #aeb7ff;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.14em;
        }

        .home-container h1 {
            margin: 0;

            font-size: clamp(48px, 8vw, 78px);

            line-height: 0.98;

            letter-spacing: -0.06em;
        }

        .home-container h1 span {
            display: block;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #929eff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .home-description {
            max-width: 560px;

            margin: 25px auto 35px;

            color: #9ba3b4;

            font-size: 16px;

            line-height: 1.7;
        }

        .home-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            min-width: 190px;

            height: 58px;

            padding: 0 25px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #7d8cff,
                    #6474ef
                );

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            box-shadow:
                0 12px 35px rgba(89, 105, 255, 0.25);

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;
        }

        .home-button:hover {
            transform: translateY(-3px);

            filter: brightness(1.08);

            box-shadow:
                0 16px 42px rgba(89, 105, 255, 0.32);
        }

        .home-button:active {
            transform: translateY(0);
        }

        .home-button-arrow {
            font-size: 18px;

            transition:
                transform 0.2s ease;
        }

        .home-button:hover .home-button-arrow {
            transform: translateX(4px);
        }

        .home-note {
            margin-top: 25px;

            color: #555e70;

            font-size: 11px;
        }

        @keyframes homeIn {
            from {
                opacity: 0;

                transform: translateY(18px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {

            .home-page {
                padding: 20px;
            }

            .home-container h1 {
                font-size: 48px;
            }

            .home-description {
                font-size: 14px;
            }

            .home-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="home-page">

        <div class="home-container">

            <div class="home-icon">
                ◎
            </div>

            <div class="home-eyebrow">
                DOMAIN INTELLIGENCE
            </div>

            <h1>
                Welcome to
                <span>Domain Lookup.</span>
            </h1>

            <p class="home-description">
                Discover publicly available registration information
                for domains using the modern RDAP system.
            </p>

            <a
                href="home.html"
                class="home-button"
            >
                Look up a domain

                <span class="home-button-arrow">
                    →
                </span>
            </a>

            <div class="home-note">
                Public registration data only
            </div>

        </div>

    </main>

</body>
</html>
